
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HustleHub Kenya</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6ff;
      color: #172554;
    }

    header {
      background: linear-gradient(120deg, #312e81, #7c3aed);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin: 5px;
    }

    header p {
      color: #e0e7ff;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin: 15px 0;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
    }

    .service {
      background: white;
      padding: 22px 12px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 12px #00000010;
    }

    .service span {
      font-size: 30px;
    }

    .service h3 {
      margin-bottom: 5px;
    }

    .welcome {
      background: #ede9fe;
      padding: 22px;
      border-radius: 15px;
      margin-top: 25px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <header>
    <h1>HustleHub 🇰🇪</h1>
    <p>Your hustle. Your opportunity.</p>
  </header>

  <main class="container">
    <h2>Find services near you</h2>

    <input class="search"
      type="search"
      placeholder="Search for a service...">

    <h2>Explore categories</h2>

    <section class="services">
      <div class="service">
        <span>🔧</span>
        <h3>Repairs</h3>
      </div>

      <div class="service">
        <span>🎨</span>
        <h3>Design</h3>
      </div>

      <div class="service">
        <span>📚</span>
        <h3>Tutoring</h3>
      </div>

      <div class="service">
        <span>💻</span>
        <h3>Technology</h3>
      </div>

      <div class="service">
        <span>🧹</span>
        <h3>Cleaning</h3>
      </div>

      <div class="service">
        <span>🚚</span>
        <h3>Delivery</h3>
      </div>
    </section>

    <section class="welcome">
      <h2>Have a skill?</h2>
      <p>Turn your talent into an opportunity.</p>
      <p>HustleHub is where local talent meets opportunity.</p>
    </section>
  </main>

  <footer>
    © 2026 HustleHub Kenya
  </footer>

<script>
  const search = document.querySelector(".search");
  const services = document.querySelectorAll(".service");

  search.addEventListener("input", function () {
    const query = search.value.toLowerCase();

    services.forEach(service => {
      const name = service.innerText.toLowerCase();

      service.style.display =
        name.includes(query) ? "block" : "none";
    });
  });
</script>
  
</body>
</html>
